flutter_native_splash:
  # Фон совпадает с внутренним splash (_Splash в main.dart): чистый белый /
  # чёрный — переход от нативного splash к Flutter-экрану бесшовный, в стиле Apple.
  # Иконка та же, что показывает _Splash (logo-icon), — визуально одно целое.
  color: "#FFFFFF"
  color_dark: "#000000"
  # Компактный логотип с «воздухом» (assets/splash-logo.png = глиф ~38% по центру
  # прозрачного квадрата) — не растянут на весь экран. Пересборка ассета:
  # python3 tool/make_splash.py
  image: assets/splash-logo.png
  image_dark: assets/splash-logo.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    image: assets/splash-logo.png
    image_dark: assets/splash-logo.png
  ios: true
  android: true
